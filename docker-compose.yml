# Local setup: everything runs on your own machine.
#   cp env.docker .env   (fill in OPENAI_API_KEY etc.)
#   docker compose up --build -d
#   open http://localhost:8000

services:
  # ── MySQL ─────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: ainews_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 只绑定本机；本机已经有 MySQL 占用 3306 的话，在 .env 里改 DB_HOST_PORT
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── FastAPI (API + frontend) ──────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ainews_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 覆盖 DB_HOST 指向容器内的 db 服务
      DB_HOST: db
      DB_PORT: "3306"
      # FAISS 索引写到 volume 里，重启不用重新建
      FAISS_INDEX_PATH: /app/faiss_index/faiss.index
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy    # 等 MySQL 健康才启动
    volumes:
      - faiss_data:/app/faiss_index   # FAISS 索引持久化
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql_data:
  faiss_data:
